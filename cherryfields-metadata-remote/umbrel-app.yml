manifestVersion: 2.0
id: cherryfields-metadata-remote
category: media
name: Metadata Remote
version: "1.2.0"
tagline: Edit audio file metadata from your browser
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/metadata-remote.png
description: >-
  Web-based audio metadata editor for headless servers. Browse your music
  folder, edit tags and extended fields, and manage cover art directly on
  the files, with no library import step.


  Mounts the music folder at /music (read-write), so edits are written straight
  to the audio files. The app has no login of its own; access is protected by
  umbrelOS.
